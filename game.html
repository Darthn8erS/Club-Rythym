<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Club Rhythm - Guitar Hero Edition</title>
    <style>
        body {
            margin: 0; padding: 0; background-color: #0a0a0a; color: #fff;
            font-family: 'Courier New', Courier, monospace; overflow: hidden; touch-action: none;
        }
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: radial-gradient(circle, #2a0000 0%, #000 90%); z-index: 10;
        }
        .hidden { display: none !important; }
        h1 { color: #ff3300; text-shadow: 0 0 15px #ff3300; text-align: center; letter-spacing: 2px; }
        .upload-btn, button {
            background: #111; color: #ff3300; border: 2px solid #ff3300;
            padding: 15px 30px; font-size: 1.2rem; margin: 10px; cursor: pointer;
            border-radius: 5px; text-transform: uppercase; font-weight: bold;
            box-shadow: 0 0 10px #ff3300; text-align: center; display: inline-block;
        }
        .upload-btn:active, button:active { background: #ff3300; color: #111; }
        input[type="file"] { display: none; }
        input[type="text"] {
            padding: 10px; font-size: 1.2rem; margin-bottom: 20px;
            border: 2px solid #ff3300; background: #222; color: #fff; text-align: center;
        }
        #game-canvas { display: block; width: 100vw; height: 100vh; }
        #hud {
            position: absolute; top: 10px; left: 10px; z-index: 5;
            pointer-events: none; text-shadow: 2px 2px 4px #000; font-size: 1.2rem;
        }
        #start-btn { background: #00ff00; color: #000; border-color: #00ff00; box-shadow: 0 0 15px #00ff00; }
        #leaderboard {
            margin-top: 15px; background: rgba(0,0,0,0.6); border: 1px solid #ff3300;
            padding: 10px; width: 80%; max-width: 300px; max-height: 120px; overflow-y: auto; font-size: 0.85rem;
        }
    </style>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>

    <div id="ui-layer">
        <h1>NEON GIG</h1>
        <p style="color: #ccc; margin-bottom: 15px;">Guitar Hero Edition</p>
        
        <input type="text" id="player-name" placeholder="Enter DJ Name" value="DarthN8erS">

        <div id="main-menu">
            <label class="upload-btn">
                Upload MP3 & Play
                <input type="file" id="audio-upload" accept="audio/mp3, audio/mpeg">
            </label>
        </div>
        
        <div id="loading-view" class="hidden">
            <h2 id="loading-text">Decoding Audio...</h2>
            <button id="start-btn" class="hidden">TAP TO START GIG</button>
        </div>

        <div id="leaderboard">
            <div style="font-weight: bold; border-bottom: 1px solid #ff3300; margin-bottom: 5px;">GLOBAL LEADERBOARD</div>
            <div id="leaderboard-list">Loading scores...</div>
        </div>
    </div>

    <div id="hud" class="hidden">
        <div>Score: <span id="score-display">0</span></div>
        <div>Combo: <span id="combo-display">0</span></div>
        <div style="color: #ff3333; margin-top: 5px;">Misses Left: <span id="misses-display">20</span></div>
    </div>

    <canvas id="game-canvas"></canvas>

    <script>
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        
        if (!firebase.apps.length) { 
            firebase.initializeApp(firebaseConfig); 
        }
        const db = firebase.firestore();

        const uiLayer = document.getElementById('ui-layer');
        const mainMenu = document.getElementById('main-menu');
        const loadingView = document.getElementById('loading-view');
        const loadingText = document.getElementById('loading-text');
        const startBtn = document.getElementById('start-btn');
        const hud = document.getElementById('hud');
        
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        canvas.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
        canvas.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
        canvas.addEventListener('touchend', (e) => e.preventDefault(), { passive: false });

        let audioContext, audioBuffer, audioSource;
        let isPlaying = false, score = 0, combo = 0, misses = 0, frameCount = 0;
        const MAX_MISSES = 20; 
        
        // Lane X coordinates across the screen width
        let laneWidth = 70;
        let startX = (canvas.width - (laneWidth * 4)) / 2;
        let lanes = [
            startX + laneWidth * 0,
            startX + laneWidth * 1,
            startX + laneWidth * 2,
            startX + laneWidth * 3
        ];
        
        let currentSongName = "Unknown Track";
        let feedbackText = "", feedbackColor = "#fff", feedbackTimer = 0;
        const laneColors = ['#ff0055', '#00ffcc', '#ffee00', '#0077ff'];

        function fetchLeaderboard() {
            db.collection("scores").orderBy("score", "desc").limit(5).get().then((querySnapshot) => {
                let html = "";
                querySnapshot.forEach((doc) => {
                    let d = doc.data();
                    html += `<div>${d.player}: ${d.score} (${d.song})</div>`;
                });
                document.getElementById('leaderboard-list').innerHTML = html || "<div>No scores yet!</div>";
            }).catch(err => {
                document.getElementById('leaderboard-list').innerHTML = "<div>Leaderboard offline</div>";
            });
        }
        fetchLeaderboard();

        document.getElementById('audio-upload').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            currentSongName = file.name.replace(/\.[^/.]+$/, "");

            mainMenu.classList.add('hidden');
            loadingView.classList.remove('hidden');

            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                audioContext = new AudioCtx();
                const arrayBuffer = await file.arrayBuffer();

                audioContext.decodeAudioData(arrayBuffer, 
                    (buffer) => {
                        audioBuffer = buffer;
                        loadingText.classList.add('hidden');
                        startBtn.classList.remove('hidden');
                    }, 
                    (error) => {
                        alert("Audio decode failed. Make sure it's a valid MP3.");
                        loadingView.classList.add('hidden');
                        mainMenu.classList.remove('hidden');
                    }
                );
            } catch (error) {
                alert("Failed to process local audio track.");
                loadingView.classList.add('hidden');
                mainMenu.classList.remove('hidden');
            }
        });

        startBtn.addEventListener('click', startGame);

        function startGame() {
            loadingView.classList.add('hidden');
            uiLayer.classList.add('hidden');
            hud.classList.remove('hidden');

            score = 0; combo = 0; misses = 0; notes = []; frameCount = 0;
            updateHUD();

            audioSource = audioContext.createBufferSource();
            audioSource.buffer = audioBuffer;
            audioSource.connect(audioContext.destination);
            audioSource.start(0);
            
            isPlaying = true;
            audioSource.onended = finishGame;
            requestAnimationFrame(gameLoop);
        }

        let notes = [];
        function spawnNote() {
            let laneIndex = Math.floor(Math.random() * 4);
            notes.push({ lane: laneIndex, y: -40, active: true });
        }

        function gameLoop() {
            if (!isPlaying) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            frameCount++;
            
            // Draw Fretboard background container
            ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
            ctx.fillRect(startX, 0, laneWidth * 4, canvas.height);

            // Draw vertical lane dividers
            ctx.strokeStyle = '#222'; ctx.lineWidth = 2;
            for (let i = 0; i <= 4; i++) {
                ctx.beginPath();
                ctx.moveTo(startX + (i * laneWidth), 0);
                ctx.lineTo(startX + (i * laneWidth), canvas.height);
                ctx.stroke();
            }

            // Target Hit Line at bottom
            const hitY = canvas.height - 140;
            ctx.strokeStyle = '#ff3300'; ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(startX, hitY);
            ctx.lineTo(startX + (laneWidth * 4), hitY);
            ctx.stroke();

            // Permanent rectangular target buttons at the bottom of each lane
            lanes.forEach((x, idx) => {
                ctx.fillStyle = laneColors[idx];
                ctx.fillRect(x + 5, hitY - 15, laneWidth - 10, 30);
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
                ctx.strokeRect(x + 5, hitY - 15, laneWidth - 10, 30);
            });

            if (frameCount % 45 === 0) {
                spawnNote();
            }

            // Draw falling rectangular Guitar Hero notes
            for (let i = notes.length - 1; i >= 0; i--) {
                let note = notes[i];
                note.y += 4.5; // Smooth fall speed

                let noteX = lanes[note.lane] + 5;
                let noteW = laneWidth - 10;
                let noteH = 24;

                ctx.fillStyle = laneColors[note.lane];
                ctx.fillRect(noteX, note.y, noteW, noteH);
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
                ctx.strokeRect(noteX, note.y, noteW, noteH);

                // Check if note passes bottom without being hit (Miss)
                if (note.y > hitY + 30) {
                    if (note.active) { 
                        misses++; 
                        combo = 0; 
                        feedbackText = "MISS";
                        feedbackColor = "#ff0000";
                        feedbackTimer = 20;
                        updateHUD(); 
                        if (misses >= MAX_MISSES) failGame(); 
                    }
                    notes.splice(i, 1);
                }
            }

            // Pop-up Feedback Text (PERFECT, GOOD, MISS)
            if (feedbackTimer > 0) {
                feedbackTimer--;
                ctx.font = "bold 28px 'Courier New'";
                ctx.fillStyle = feedbackColor;
                ctx.textAlign = "center";
                ctx.fillText(feedbackText, canvas.width / 2, canvas.height / 2 - 80);
            }

            requestAnimationFrame(gameLoop);
        }

        canvas.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            const hitY = canvas.height - 140;
            let hit = false;

            let tappedLane = -1;
            lanes.forEach((x, idx) => {
                if (touch.clientX >= x && touch.clientX <= x + laneWidth) {
                    tappedLane = idx;
                }
            });

            if (tappedLane !== -1) {
                notes.forEach(note => {
                    if (!note.active || note.lane !== tappedLane) return;
                    let distance = Math.abs(note.y - hitY);
                    
                    if (distance < 50) {
                        note.active = false;
                        hit = true;

                        if (distance < 18) {
                            score += 300 + (combo * 15);
                            feedbackText = "PERFECT!";
                            feedbackColor = "#00ff00";
                        } else {
                            score += 100 + (combo * 5);
                            feedbackText = "GOOD";
                            feedbackColor = "#ffaa00";
                        }
                        combo++;
                        feedbackTimer = 20;
                        updateHUD();
                    }
                });
            }

            if (!hit && Math.abs(touch.clientY - hitY) < 100) {
                combo = 0;
                misses++;
                feedbackText = "BAD";
                feedbackColor = "#ff0000";
                feedbackTimer = 20;
                updateHUD();
                if (misses >= MAX_MISSES) failGame();
            }
        });

        function updateHUD() {
            document.getElementById('score-display').innerText = score;
            document.getElementById('combo-display').innerText = combo;
            document.getElementById('misses-display').innerText = MAX_MISSES - misses;
        }

        function failGame() {
            if(audioSource) audioSource.stop();
            alert("Gig Over! The crowd booed you off.");
            endGame();
        }

        function finishGame() {
            let playerName = document.getElementById('player-name').value || "Anonymous";
            db.collection("scores").add({
                player: playerName,
                score: score,
                song: currentSongName,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                fetchLeaderboard();
            }).catch(error => {
                console.error("Error writing score: ", error);
            });
            endGame();
        }

        function endGame() {
            isPlaying = false;
            hud.classList.add('hidden');
            uiLayer.classList.remove('hidden');
            mainMenu.classList.remove('hidden');
            loadingText.classList.remove('hidden');
            startBtn.classList.add('hidden');
            fetchLeaderboard();
        }
    </script>
</body>
</html>
