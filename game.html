<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Club Rhythm - Global Rock Tour</title>
    <style>
        body {
            margin: 0; padding: 0; background-color: #050505; color: #fff;
            font-family: 'Courier New', Courier, monospace; overflow: hidden; touch-action: none;
        }
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: radial-gradient(circle, #1a0000 0%, #000 85%); z-index: 10; padding: 20px; box-sizing: border-box;
        }
        .hidden { display: none !important; }
        h1 { color: #ff3300; text-shadow: 0 0 15px #ff3300; text-align: center; letter-spacing: 3px; margin: 5px; }
        .panel {
            background: rgba(0,0,0,0.8); border: 2px solid #ff3300; border-radius: 8px;
            padding: 15px; width: 90%; max-width: 350px; max-height: 45vh; overflow-y: auto; text-align: center; margin-bottom: 10px;
            box-shadow: 0 0 15px rgba(255,51,0,0.3);
        }
        button, .upload-btn {
            background: #111; color: #ff3300; border: 2px solid #ff3300;
            padding: 12px 20px; font-size: 1rem; margin: 6px; cursor: pointer;
            border-radius: 5px; text-transform: uppercase; font-weight: bold;
            box-shadow: 0 0 8px #ff3300; display: inline-block; width: 85%;
        }
        button:active, .upload-btn:active { background: #ff3300; color: #111; }
        input[type="file"] { display: none; }
        input[type="text"] {
            padding: 10px; font-size: 1rem; width: 80%; margin-bottom: 10px;
            border: 2px solid #ff3300; background: #222; color: #fff; text-align: center; border-radius: 4px;
        }
        #game-canvas { display: block; width: 100vw; height: 100vh; }
        #hud {
            position: absolute; top: 10px; left: 10px; z-index: 5;
            pointer-events: none; text-shadow: 2px 2px 4px #000; font-size: 1.1rem;
        }
        .song-item {
            background: #151515; border: 1px solid #444; padding: 8px; margin: 6px 0; border-radius: 4px;
            cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem;
        }
        .song-item:hover { border-color: #ff3300; background: #221111; }
    </style>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
</head>
<body>

    <div id="ui-layer">
        <h1>CLUB RHYTHM</h1>
        <p style="color: #aaa; margin-bottom: 10px; font-size: 0.9rem;">Global Challenge Edition</p>
        
        <input type="text" id="player-name" placeholder="Enter DJ Name" value="DarthN8erS">

        <div id="menu-view">
            <label class="upload-btn">
                Upload New MP3
                <input type="file" id="audio-upload" accept="audio/mp3, audio/mpeg">
            </label>
            
            <div class="panel">
                <div style="font-weight: bold; border-bottom: 1px solid #ff3300; margin-bottom: 8px; padding-bottom: 4px;">GLOBAL SONG VAULT</div>
                <div id="song-library-list">Loading community tracks...</div>
            </div>

            <div class="panel" style="max-height: 25vh;">
                <div style="font-weight: bold; border-bottom: 1px solid #ff3300; margin-bottom: 8px; padding-bottom: 4px;">TOP HIGH SCORES</div>
                <div id="leaderboard-list">Loading leaderboard...</div>
            </div>
        </div>
        
        <div id="loading-view" class="hidden">
            <h2 id="loading-text" style="color: #ff3300;">Uploading & Syncing Track...</h2>
            <div id="upload-progress" style="font-size: 1.2rem; color: #00ffcc; margin: 10px;">0%</div>
        </div>
    </div>

    <div id="hud" class="hidden">
        <div>Score: <span id="score-display">0</span></div>
        <div>Multiplier: <span id="multiplier-display">1</span>x</div>
        <div style="color: #ff3333; margin-top: 5px;">Misses Left: <span id="misses-display">20</span></div>
    </div>

    <canvas id="game-canvas"></canvas>

    <script>
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();
        const storage = firebase.storage();

        const uiLayer = document.getElementById('ui-layer');
        const menuView = document.getElementById('menu-view');
        const loadingView = document.getElementById('loading-view');
        const loadingText = document.getElementById('loading-text');
        const uploadProgress = document.getElementById('upload-progress');
        const hud = document.getElementById('hud');
        
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        canvas.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
        canvas.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
        canvas.addEventListener('touchend', (e) => e.preventDefault(), { passive: false });

        let audioContext, audioBuffer, audioSource;
        let isPlaying = false, score = 0, combo = 0, misses = 0, multiplier = 1, frameCount = 0;
        const MAX_MISSES = 20; 
        let notes = [];
        let currentSongName = "", currentSongUrl = "";
        const laneColors = ['#ff0055', '#00ffcc', '#ffee00', '#0077ff']; // Red, Green, Yellow, Blue

        function loadGlobalData() {
            // Load Song Vault
            db.collection("songs").orderBy("timestamp", "desc").limit(10).get().then((snapshot) => {
                let html = "";
                snapshot.forEach((doc) => {
                    let s = doc.data();
                    html += `<div class="song-item" onclick="playCloudSong('${s.url}', '${s.name}')">
                        <span>🎵 ${s.name}</span>
                        <span style="color:#00ffcc; font-size:0.75rem;">PLAY ▶</span>
                    </div>`;
                });
                document.getElementById('song-library-list').innerHTML = html || "<div>No songs in vault yet! Upload one.</div>";
            });

            // Load Leaderboard
            db.collection("scores").orderBy("score", "desc").limit(5).get().then((snapshot) => {
                let html = "";
                snapshot.forEach((doc) => {
                    let d = doc.data();
                    html += `<div>${d.player}: ${d.score} (${d.song})</div>`;
                });
                document.getElementById('leaderboard-list').innerHTML = html || "<div>No scores yet!</div>";
            });
        }
        loadGlobalData();

        // Handle File Upload to Cloud Storage & Firestore Vault
        document.getElementById('audio-upload').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            let songName = file.name.replace(/\.[^/.]+$/, "");

            menuView.classList.add('hidden');
            loadingView.classList.remove('hidden');
            loadingText.innerText = "Uploading MP3 to Cloud Vault...";

            try {
                let storageRef = storage.ref(`songs/${Date.now()}_${file.name}`);
                let uploadTask = storageRef.put(file);

                uploadTask.on('state_changed', 
                    (snapshot) => {
                        let progress = Math.round((snapshot.bytesTransferred / snapshot.totalBytes) * 100);
                        uploadProgress.innerText = `${progress}%`;
                    }, 
                    (error) => {
                        alert("Upload failed. Check Firebase Storage rules.");
                        resetMenu();
                    }, 
                    async () => {
                        let downloadURL = await uploadTask.snapshot.ref.getDownloadURL();
                        
                        // Save song metadata to Firestore so everyone can access it
                        await db.collection("songs").add({
                            name: songName,
                            url: downloadURL,
                            creator: document.getElementById('player-name').value || "Anonymous",
                            timestamp: firebase.firestore.FieldValue.serverTimestamp()
                        });

                        loadGlobalData();
                        startSongDownload(downloadURL, songName);
                    }
                );
            } catch (err) {
                alert("Cloud upload error.");
                resetMenu();
            }
        });

        window.playCloudSong = function(url, name) {
            currentSongName = name;
            currentSongUrl = url;
            menuView.classList.add('hidden');
            loadingView.classList.remove('hidden');
            loadingText.innerText = "Downloading Track...";
            uploadProgress.innerText = "";
            startSongDownload(url, name);
        };

        async function startSongDownload(url, name) {
            currentSongName = name;
            try {
                const response = await fetch(url);
                const arrayBuffer = await response.arrayBuffer();
                
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                audioContext = new AudioCtx();

                audioContext.decodeAudioData(arrayBuffer, (buffer) => {
                    audioBuffer = buffer;
                    loadingView.classList.add('hidden');
                    startGame();
                }, (err) => {
                    alert("Failed to decode audio file.");
                    resetMenu();
                });
            } catch (e) {
                alert("Failed to fetch audio from cloud storage.");
                resetMenu();
            }
        }

        function startGame() {
            uiLayer.classList.add('hidden');
            hud.classList.remove('hidden');

            score = 0; combo = 0; misses = 0; multiplier = 1; notes = []; frameCount = 0;
            updateHUD();

            audioSource = audioContext.createBufferSource();
            audioSource.buffer = audioBuffer;
            audioSource.connect(audioContext.destination);
            audioSource.start(0);
            
            isPlaying = true;
            audioSource.onended = finishGame;
            requestAnimationFrame(gameLoop);
        }

        function spawnNote() {
            let laneIndex = Math.floor(Math.random() * 4);
            notes.push({ lane: laneIndex, progress: 0, active: true }); // Progress 0 (horizon) to 1 (strike line)
        }

        function gameLoop() {
            if (!isPlaying) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            frameCount++;

            if (frameCount % 45 === 0) {
                spawnNote();
            }

            // --- RENDER 3D PERSPECTIVE HIGHWAY (Guitar Hero Style) ---
            let vanishingX = canvas.width / 2;
            let vanishingY = canvas.height * 0.25;
            let highwayBottomWidth = Math.min(canvas.width * 0.8, 450);
            let highwayTopWidth = 60;
            let strikeY = canvas.height - 130;

            let leftTop = vanishingX - (highwayTopWidth / 2);
            let rightTop = vanishingX + (highwayTopWidth / 2);
            let leftBottom = vanishingX - (highwayBottomWidth / 2);
            let rightBottom = vanishingX + (highwayBottomWidth / 2);

            // Highway background
            ctx.fillStyle = 'rgba(10, 10, 15, 0.9)';
            ctx.beginPath();
            ctx.moveTo(leftTop, vanishingY);
            ctx.lineTo(rightTop, vanishingY);
            ctx.lineTo(rightBottom, strikeY);
            ctx.lineTo(leftBottom, strikeY);
            ctx.closePath();
            ctx.fill();

            // 4 Fret Lanes
            for (let i = 0; i <= 4; i++) {
                let topX = leftTop + (highwayTopWidth / 4) * i;
                let bottomX = leftBottom + (highwayBottomWidth / 4) * i;
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(topX, vanishingY);
                ctx.lineTo(bottomX, strikeY);
                ctx.stroke();
            }

            // Target Strike Line & Glow
            ctx.fillStyle = 'rgba(255, 51, 0, 0.4)';
            ctx.fillRect(leftBottom, strikeY - 15, highwayBottomWidth, 30);
            ctx.strokeStyle = '#ff3300';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(leftBottom, strikeY);
            ctx.lineTo(rightBottom, strikeY);
            ctx.stroke();

            // Permanent Target Buttons at Bottom Strike Line
            for (let i = 0; i < 4; i++) {
                let btnW = highwayBottomWidth / 4;
                let btnX = leftBottom + (btnW * i);
                ctx.fillStyle = laneColors[i];
                ctx.fillRect(btnX + 4, strikeY - 12, btnW - 8, 24);
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.strokeRect(btnX + 4, strikeY - 12, btnW - 8, 24);
            }

            // --- RENDER FALLING NOTES ALONG PERSPECTIVE HIGHWAY ---
            for (let i = notes.length - 1; i >= 0; i--) {
                let note = notes[i];
                note.progress += 0.012; // Speed multiplier

                // Interpolate 3D coordinates based on progress (0 to 1)
                let currentY = vanishingY + (strikeY - vanishingY) * note.progress;
                let currentTopW = highwayTopWidth + (highwayBottomWidth - highwayTopWidth) * note.progress;
                let currentLeft = vanishingX - (currentTopW / 2);
                let laneW = currentTopW / 4;
                let noteX = currentLeft + (laneW * note.lane) + 2;
                let noteW = laneW - 4;
                let noteH = 14 * note.progress; // Perspective scaling

                if (note.progress < 1.1) {
                    ctx.fillStyle = laneColors[note.lane];
                    ctx.fillRect(noteX, currentY, noteW, noteH);
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 1.5;
                    ctx.strokeRect(noteX, currentY, noteW, noteH);
                }

                // Miss check when note passes strike line
                if (note.progress > 1.05) {
                    if (note.active) {
                        misses++;
                        combo = 0;
                        multiplier = 1;
                        updateHUD();
                        if (misses >= MAX_MISSES) failGame();
                    }
                    notes.splice(i, 1);
                }
            }

            requestAnimationFrame(gameLoop);
        }

        // Touch Input matching lanes
        canvas.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            let highwayBottomWidth = Math.min(canvas.width * 0.8, 450);
            let vanishingX = canvas.width / 2;
            let leftBottom = vanishingX - (highwayBottomWidth / 2);
            let strikeY = canvas.height - 130;

            let tappedLane = -1;
            let laneW = highwayBottomWidth / 4;

            for (let i = 0; i < 4; i++) {
                let laneX = leftBottom + (laneW * i);
                if (touch.clientX >= laneX && touch.clientX <= laneX + laneW) {
                    tappedLane = i;
                }
            }

            let hitRegistered = false;
            if (tappedLane !== -1) {
                notes.forEach(note => {
                    if (!note.active || note.lane !== tappedLane) return;
                    let distance = Math.abs(note.progress - 1.0); // Close to strike line

                    if (distance < 0.15) {
                        note.active = false;
                        hitRegistered = true;
                        score += 100 * multiplier;
                        combo++;
                        if (combo >= 20) multiplier = 4;
                        else if (combo >= 10) multiplier = 3;
                        else if (combo >= 5) multiplier = 2;
                        updateHUD();
                    }
                });
            }

            if (!hitRegistered && Math.abs(touch.clientY - strikeY) < 80) {
                combo = 0;
                multiplier = 1;
                misses++;
                updateHUD();
                if (misses >= MAX_MISSES) failGame();
            }
        });

        function updateHUD() {
            document.getElementById('score-display').innerText = score;
            document.getElementById('multiplier-display').innerText = multiplier;
            document.getElementById('misses-display').innerText = MAX_MISSES - misses;
        }

        function failGame() {
            if(audioSource) audioSource.stop();
            alert("Gig Over! You missed too many notes.");
            endGame();
        }

        function finishGame() {
            let playerName = document.getElementById('player-name').value || "Anonymous";
            db.collection("scores").add({
                player: playerName,
                score: score,
                song: currentSongName,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                loadGlobalData();
            });
            endGame();
        }

        function endGame() {
            isPlaying = false;
            hud.classList.add('hidden');
            uiLayer.classList.remove('hidden');
            resetMenu();
            loadGlobalData();
        }

        function resetMenu() {
            loadingView.classList.add('hidden');
            menuView.classList.remove('hidden');
        }
    </script>
</body>
</html>
