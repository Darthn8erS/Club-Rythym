<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Gig - Rhythm Tour</title>
    <style>
        body {
            margin: 0; padding: 0; background-color: #0a0a0a; color: #fff;
            font-family: 'Courier New', Courier, monospace; overflow: hidden; touch-action: none;
        }
        #ui-layer {
            position: absolute; top: -20px; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: radial-gradient(circle, #2a0000 0%, #000 90%); z-index: 10;
        }
        .hidden { display: none !important; }
        h1 { color: #ff3300; text-shadow: 0 0 15px #ff3300; text-align: center; letter-spacing: 2px; }
        .upload-btn, button {
            background: #111; color: #ff3300; border: 2px solid #ff3300;
            padding: 15px 30px; font-size: 1.2rem; margin: 10px; cursor: pointer;
            border-radius: 5px; text-transform: uppercase; font-weight: bold;
            box-shadow: 0 0 10px #ff3300; text-align: center; display: inline-block;
        }
        .upload-btn:active, button:active { background: #ff3300; color: #111; }
        input[type="file"] { display: none; }
        input[type="text"] {
            padding: 10px; font-size: 1.2rem; margin-bottom: 20px;
            border: 2px solid #ff3300; background: #222; color: #fff; text-align: center;
        }
        #game-canvas { display: block; width: 100vw; height: 100vh; }
        #hud {
            position: absolute; top: 10px; left: 10px; z-index: 5;
            pointer-events: none; text-shadow: 2px 2px 4px #000; font-size: 1.2rem;
        }
        #start-btn { background: #00ff00; color: #000; border-color: #00ff00; box-shadow: 0 0 15px #00ff00; }
    </style>
</head>
<body>

    <div id="ui-layer">
        <h1>NEON GIG</h1>
        <p style="color: #ccc; margin-bottom: 20px;">DJ Player</p>
        
        <input type="text" id="player-name" placeholder="Enter DJ Name" value="DarthN8erS">

        <div id="main-menu">
            <label class="upload-btn">
                Upload MP3 & Play
                <input type="file" id="audio-upload" accept="audio/mp3, audio/mpeg">
            </label>
        </div>
        
        <div id="loading-view" class="hidden">
            <h2 id="loading-text">Decoding Audio...</h2>
            <button id="start-btn" class="hidden">TAP TO START GIG</button>
        </div>
    </div>

    <div id="hud" class="hidden">
        <div>Score: <span id="score-display">0</span></div>
        <div>Combo: <span id="combo-display">0</span></div>
        <div style="color: #ff3333; margin-top: 5px;">Misses Left: <span id="misses-display">20</span></div>
    </div>

    <canvas id="game-canvas"></canvas>

    <script>
        const uiLayer = document.getElementById('ui-layer');
        const mainMenu = document.getElementById('main-menu');
        const loadingView = document.getElementById('loading-view');
        const loadingText = document.getElementById('loading-text');
        const startBtn = document.getElementById('start-btn');
        const hud = document.getElementById('hud');
        
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        canvas.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
        canvas.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
        canvas.addEventListener('touchend', (e) => e.preventDefault(), { passive: false });

        let audioContext, audioBuffer, audioSource, analyser;
        let isPlaying = false, score = 0, combo = 0, misses = 0, lastSpawnTime = 0;
        const MAX_MISSES = 20; 
        let notes = [], lanes = [canvas.width*0.2, canvas.width*0.4, canvas.width*0.6, canvas.width*0.8];

        document.getElementById('audio-upload').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            mainMenu.classList.add('hidden');
            loadingView.classList.remove('hidden');

            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                audioContext = new AudioCtx();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;

                const arrayBuffer = await file.arrayBuffer();

                audioContext.decodeAudioData(arrayBuffer, 
                    (buffer) => {
                        audioBuffer = buffer;
                        loadingText.classList.add('hidden');
                        startBtn.classList.remove('hidden');
                    }, 
                    (error) => {
                        alert("Audio decode failed. Make sure it's a valid MP3 file.");
                        loadingView.classList.add('hidden');
                        mainMenu.classList.remove('hidden');
                    }
                );
            } catch (error) {
                alert("Failed to process the audio file.");
                loadingView.classList.add('hidden');
                mainMenu.classList.remove('hidden');
            }
        });

        startBtn.addEventListener('click', startGame);

        function startGame() {
            loadingView.classList.add('hidden');
            uiLayer.classList.add('hidden');
            hud.classList.remove('hidden');

            score = 0; combo = 0; misses = 0; notes = []; lastSpawnTime = 0;
            updateHUD();

            audioSource = audioContext.createBufferSource();
            audioSource.buffer = audioBuffer;
            audioSource.connect(analyser);
            analyser.connect(audioContext.destination);
            audioSource.start(0);
            
            isPlaying = true;
            audioSource.onended = endGame;
            requestAnimationFrame(gameLoop);
        }

        function spawnNote() {
            notes.push({ x: lanes[Math.floor(Math.random() * 4)], y: -50, radius: 30, active: true });
        }

        function gameLoop(timestamp) {
            if (!isPlaying) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = '#555'; ctx.lineWidth = 4;
            lanes.forEach(x => { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); });
            
            const dataArray = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(dataArray);
            let avgEnergy = dataArray.reduce((a, b) => a + b) / dataArray.length;
            
            if (avgEnergy > 150 && Math.random() > 0.5 && timestamp - lastSpawnTime > 350) {
                spawnNote();
                lastSpawnTime = timestamp;
            }

            const hitY = canvas.height - 120;
            ctx.fillStyle = 'rgba(255, 51, 0, 0.3)';
            ctx.fillRect(0, hitY - 40, canvas.width, 80);

            for (let i = notes.length - 1; i >= 0; i--) {
                let note = notes[i];
                note.y += 3.5; 

                ctx.fillStyle = '#ffaa00';
                ctx.beginPath(); ctx.arc(note.x, note.y, note.radius, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#ff3300';
                ctx.beginPath(); ctx.arc(note.x, note.y, note.radius * 0.6, 0, Math.PI * 2); ctx.fill();

                if (note.y > canvas.height) {
                    if (note.active) { misses++; combo = 0; updateHUD(); if (misses >= MAX_MISSES) failGame(); }
                    notes.splice(i, 1);
                }
            }
            requestAnimationFrame(gameLoop);
        }

        canvas.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            const hitY = canvas.height - 120;
            let hit = false;
            
            notes.forEach(note => {
                if (!note.active) return;
                if (Math.abs(note.y - hitY) < 80 && Math.abs(note.x - touch.clientX) < 80) {
                    note.active = false;
                    score += 100 + (combo * 10);
                    combo++; hit = true; updateHUD();
                }
            });

            if (!hit) { combo = 0; misses++; updateHUD(); if (misses >= MAX_MISSES) failGame(); }
        });

        function updateHUD() {
            document.getElementById('score-display').innerText = score;
            document.getElementById('combo-display').innerText = combo;
            document.getElementById('misses-display').innerText = MAX_MISSES - misses;
        }

        function failGame() {
            audioSource.stop();
            alert("Gig Over! The crowd booed you off.");
            endGame();
        }

        function endGame() {
            isPlaying = false;
            hud.classList.add('hidden');
            uiLayer.classList.remove('hidden');
            mainMenu.classList.remove('hidden');
            loadingText.classList.remove('hidden');
            startBtn.classList.add('hidden');
        }
    </script>
</body>
</html>
